
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PT 2.5 - GOOGLE SIGN IN</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta name="google-signin-client_id" content="275495546358-r3bva4cd8smof04afmctflu77njd3pqj.apps.googleusercontent.com">
</head>
<body>
    <h1>PT 2.5 - GOOGLE SIGN IN</h1>
    <p>Página preparada para añadir el OAuth 2</p>
    <div
        id="g_id_onload"
        data-client_id="275495546358-r3bva4cd8smof04afmctflu77njd3pqj.apps.googleusercontent.com"
        data-callback="onSignIn">
    </div>
    <div class="g_id_signin"
         data-type="standard">
    </div>
    <button
        id="boto-sortir"
        style="display:none;"
        onclick="signOut()">
        Desconnectar
    </button>
</body>
</html>
